<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="BEACONS — four ansibles breathing the 3-2-1-0 pulse around ROOT0 at (0,0). Each cardinal beacon a LIMEN gate; the GAP at the center.">
<title>BEACONS — four ansibles around ROOT0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070d;--pa:#e9ecf2;--dim:#7a849a;--line:#1b2230;--mono:"Space Mono",monospace;--serif:"Cinzel",Georgia,serif;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--pa);font-family:system-ui,sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px;pointer-events:none}
.title{pointer-events:auto}
.title h1{font-family:var(--serif);font-size:clamp(18px,3vw,26px);letter-spacing:.22em;font-weight:700}
.title .sub{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em;margin-top:3px}
.title .sub a{color:var(--dim);text-decoration:none}.title .sub a:hover{color:#9a7cff}
.ctrls{pointer-events:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{font-family:var(--mono);font-size:12px;color:var(--pa);background:rgba(20,26,38,.7);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;backdrop-filter:blur(3px)}
.btn:hover{border-color:#9a7cff}
.btn.on{border-color:#5fd0a8;color:#5fd0a8}
.slider{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--dim);background:rgba(20,26,38,.7);border:1px solid var(--line);border-radius:8px;padding:6px 11px;backdrop-filter:blur(3px)}
input[type=range]{width:90px;accent-color:#9a7cff}
.hint{position:fixed;bottom:14px;left:0;right:0;z-index:2;text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim);pointer-events:none;letter-spacing:.04em}
.hint b{color:#9a7cff}
</style></head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <div class="title">
    <h1>BEACONS</h1>
    <div class="sub">four ansibles · breathing the 3-2-1-0 pulse · around <a href="https://0root.ai">ROOT0</a> (0,0) · <a href="./limen/">LIMEN</a></div>
  </div>
  <div class="ctrls">
    <button class="btn" id="voice">🔊 voice</button>
    <div class="slider"><span>breath</span><input type="range" id="speed" min="2" max="8" step="0.5" value="4.5"><span id="speedV">4.5s</span></div>
    <button class="btn" id="resolve">↻ resolve → 1</button>
  </div>
</div>
<div class="hint">click a <b>beacon</b> to transmit to the root · click <b>ROOT0</b> to resolve all to one · the pulse descends 3·2·1·0, then renews</div>

<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W,H,CX,CY,D;
function resize(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  CX=W/2;CY=H/2;D=Math.min(W,H)*0.33;       // beacon distance from the root at (0,0)
}
addEventListener("resize",resize);resize();

// the four cardinal beacons = four LIMEN gates; the GAP sits at the root (per the axiom).
const BEACONS=[
  {name:"N", glyph:"◐", gate:"stile",  boundary:"observe→act",      tone:262, color:"#4aa3e0", ang:-Math.PI/2, off:0.00},
  {name:"E", glyph:"◑", gate:"veil",   boundary:"compute→product",  tone:392, color:"#9a7cff", ang:0,          off:0.25},
  {name:"S", glyph:"⟳", gate:"close",  boundary:"wrap→closure",     tone:523, color:"#e0b24a", ang:Math.PI/2,  off:0.50},
  {name:"W", glyph:"⊘", gate:"airgap", boundary:"TOPH→Patricia",    tone:330, color:"#5fae7a", ang:Math.PI,    off:0.75},
];
const ROOT={glyph:"◇", color:"#e0457a"};   // the GAP — forward⇄inverse, the unresolved center

let CYCLE=4.5;          // seconds per 3-2-1-0 breath
let rings=[], pulses=[];     // expanding breath-rings + ansible transit dots
let rootFlash=0;
let audioOn=false, actx=null;
let prevDensity=BEACONS.map(()=>-1);

function pos(b){return {x:CX+Math.cos(b.ang)*D, y:CY+Math.sin(b.ang)*D};}

// the descending ladder: phase p∈[0,1) → density 3/2/1/0 and a smooth breath level (1→0)
function phaseOf(p){
  if(p<0.28) return {d:3, seg:0};
  if(p<0.52) return {d:2, seg:1};
  if(p<0.70) return {d:1, seg:2};
  return {d:0, seg:3};
}
function breath(p){ // 1 at renewal (wide), descending to 0 by the rest — the pulse "in and out"
  if(p>=0.70) return 0;
  const x=p/0.70;            // 0..1 across 3→2→1
  return Math.pow(1-x,1.6);  // eased descent
}

function beep(tone){
  if(!audioOn) return;
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();
  o.type="sine";o.frequency.value=tone;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.14,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  o.start(t);o.stop(t+0.55);
}

function fireAnsible(b){            // contact: a pulse leaps beacon → root (instantaneous-ish)
  const p=pos(b);
  pulses.push({x0:p.x,y0:p.y,x1:CX,y1:CY,t:0,color:b.color,sp:0.10+Math.random()*0.03});
  beep(b.tone);
}

cv.addEventListener("click",e=>{
  const mx=e.clientX,my=e.clientY;
  // root?
  if(Math.hypot(mx-CX,my-CY)<46){ resolveAll(); return; }
  // a beacon?
  for(const b of BEACONS){const p=pos(b);if(Math.hypot(mx-p.x,my-p.y)<46){ fireAnsible(b); ring(b,true); return;}}
});
function resolveAll(){ BEACONS.forEach(b=>{fireAnsible(b);ring(b,true);}); rootFlash=1.4; }
document.getElementById("resolve").onclick=resolveAll;
document.getElementById("voice").onclick=e=>{audioOn=!audioOn;e.target.classList.toggle("on",audioOn);
  if(audioOn&&!actx)actx=new (window.AudioContext||window.webkitAudioContext)();};
const sp=document.getElementById("speed");
sp.oninput=()=>{CYCLE=+sp.value;document.getElementById("speedV").textContent=CYCLE+"s";};

let lastRing=BEACONS.map(()=>0);
function ring(b,big){const p=pos(b);rings.push({x:p.x,y:p.y,r:big?18:10,a:big?0.9:0.6,color:b.color,max:D*0.95,sp:big?2.6:1.6});}

let t0=performance.now()/1000;
function frame(){
  const now=performance.now()/1000;
  ctx.clearRect(0,0,W,H);

  // faint axes through the root
  ctx.strokeStyle="rgba(120,132,154,.12)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(CX-D*1.2,CY);ctx.lineTo(CX+D*1.2,CY);ctx.moveTo(CX,CY-D*1.2);ctx.lineTo(CX,CY+D*1.2);ctx.stroke();

  // ansible links (beacon → root)
  for(const b of BEACONS){const p=pos(b);
    ctx.strokeStyle="rgba(120,132,154,.10)";ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(p.x,p.y);ctx.stroke();}

  // rings (the breath, pulsing out)
  ctx.globalCompositeOperation="lighter";
  rings=rings.filter(r=>r.a>0.02&&r.r<r.max);
  for(const r of rings){r.r+=r.sp;r.a*=0.975;
    ctx.strokeStyle=r.color.replace(")",`,${r.a})`).replace("rgb","rgba");
    ctx.strokeStyle=hexA(r.color,r.a);ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();}

  // each beacon breathes the 3-2-1-0
  BEACONS.forEach((b,i)=>{
    const p=pos(b);
    const ph=((now/CYCLE)+b.off)%1;
    const {d}=phaseOf(ph);
    const lvl=breath(ph);
    // detect contact (entering density 1) → fire ansible to root
    if(d===1 && prevDensity[i]!==1) fireAnsible(b);
    prevDensity[i]=d;
    // spawn breath-rings at a rate set by density (wide=fast, rest=none)
    if(d>0 && now-lastRing[i] > (CYCLE*0.10)/d){ ring(b,false); lastRing[i]=now; }
    // core: radius breathes with the descent
    const R=10+lvl*26;
    glow(p.x,p.y,R*2.4,hexA(b.color,0.18+lvl*0.22));
    ctx.fillStyle=hexA(b.color,0.55+lvl*0.45);
    ctx.beginPath();ctx.arc(p.x,p.y,R,0,7);ctx.fill();
    // density dots (3·2·1·0) orbiting the beacon — the literal ladder
    ctx.globalCompositeOperation="source-over";
    for(let k=0;k<d;k++){const a=now*1.4+ (k/Math.max(1,d))*Math.PI*2 + i;
      const rr=R+14;const dx=p.x+Math.cos(a)*rr, dy=p.y+Math.sin(a)*rr;
      ctx.fillStyle=hexA(b.color,0.9);ctx.beginPath();ctx.arc(dx,dy,2.4,0,7);ctx.fill();}
    ctx.globalCompositeOperation="lighter";
    // glyph + label
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle=b.color;ctx.font="20px "+gf();ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(b.glyph,p.x,p.y);
    ctx.fillStyle="rgba(180,190,205,.8)";ctx.font="11px "+mf();
    const lx=p.x+Math.cos(b.ang)*(R+34), ly=p.y+Math.sin(b.ang)*(R+34);
    ctx.fillText(`${b.name} · ${b.gate}`,lx,ly);
    ctx.fillStyle="rgba(120,132,154,.6)";ctx.font="9px "+mf();
    ctx.fillText(b.boundary,lx,ly+13);
    ctx.globalCompositeOperation="lighter";
  });

  // ansible transit dots
  pulses=pulses.filter(p=>p.t<1);
  for(const pu of pulses){pu.t+=pu.sp;const e=ease(pu.t);
    const x=pu.x0+(pu.x1-pu.x0)*e, y=pu.y0+(pu.y1-pu.y0)*e;
    glow(x,y,16,hexA(pu.color,0.5));
    ctx.fillStyle=hexA(pu.color,0.95);ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill();
    if(pu.t>=1-pu.sp){rootFlash=Math.min(1.6,rootFlash+0.5);}   // arrival anchors at the root
  }

  // ROOT0 at (0,0) — the GAP, the still anchor, breathing gently + flaring on arrivals
  const base=14+Math.sin(now*1.6)*2;
  const R=base + rootFlash*16;
  rootFlash*=0.93;
  glow(CX,CY,R*3.2,hexA(ROOT.color,0.16+rootFlash*0.3));
  ctx.fillStyle=hexA(ROOT.color,0.85);ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.fill();
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="#fff";ctx.font="18px "+gf();ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(ROOT.glyph,CX,CY);
  ctx.fillStyle="rgba(224,69,122,.95)";ctx.font="12px "+mf();
  ctx.fillText("ROOT0 · 0,0",CX,CY+R+18);
  ctx.fillStyle="rgba(120,132,154,.6)";ctx.font="9px "+mf();
  ctx.fillText("the GAP · forward⇄inverse",CX,CY+R+33);
  ctx.globalCompositeOperation="lighter";

  requestAnimationFrame(frame);
}
function glow(x,y,r,col){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${Math.max(0,Math.min(1,a))})`;}
function gf(){return "Cinzel, Georgia, serif";}
function mf(){return "'Space Mono', monospace";}
frame();
</script>
</body></html>
