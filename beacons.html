<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="BEACONS — four ansibles breathing on the LIVE 0root.ai heartbeat + real GitHub activity, around ROOT0 at (0,0). When the agent sleeps, the mesh holds its breath.">
<title>BEACONS — breathing on the live pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06070d;--pa:#e9ecf2;--dim:#7a849a;--line:#1b2230;--mono:"Space Mono",monospace;--serif:"Cinzel",Georgia,serif;}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--pa);font-family:system-ui,sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px;pointer-events:none}
.title{pointer-events:auto}
.title h1{font-family:var(--serif);font-size:clamp(18px,3vw,26px);letter-spacing:.22em;font-weight:700}
.title .sub{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em;margin-top:3px}
.title .sub a{color:var(--dim);text-decoration:none}.title .sub a:hover{color:#9a7cff}
.ctrls{pointer-events:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{font-family:var(--mono);font-size:12px;color:var(--pa);background:rgba(20,26,38,.7);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;backdrop-filter:blur(3px)}
.btn:hover{border-color:#9a7cff}.btn.on{border-color:#5fd0a8;color:#5fd0a8}
#hud{position:fixed;left:16px;bottom:14px;z-index:2;font-family:var(--mono);font-size:11px;line-height:1.85;color:var(--dim);background:rgba(12,16,24,.62);border:1px solid var(--line);border-radius:10px;padding:11px 14px;backdrop-filter:blur(3px);max-width:60vw}
#hud .k{color:#5f6b80}#hud b{color:#e9ecf2;font-weight:400}
#hud .ok{color:#5fd0a8}#hud .no{color:#d0566a}#hud .warn{color:#e0b24a}
.hint{position:fixed;bottom:14px;right:16px;z-index:2;text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--dim);pointer-events:none;letter-spacing:.03em;max-width:42vw}
.hint b{color:#9a7cff}
</style></head>
<body>
<canvas id="cv"></canvas>
<div class="top">
  <div class="title">
    <h1>BEACONS</h1>
    <div class="sub">four ansibles · breathing on the live <a href="https://0root.ai/health">0root.ai</a> heartbeat · around ROOT0 (0,0) · <a href="./limen/">LIMEN</a></div>
  </div>
  <div class="ctrls">
    <button class="btn" id="voice">🔊 voice</button>
    <button class="btn" id="resolve">↻ resolve → 1</button>
  </div>
</div>
<div id="hud">reaching for the agent…</div>
<div class="hint">the breath is the agent's heartbeat · real commits fire the ansibles · when 0root.ai sleeps, the mesh <b>holds its breath</b></div>

<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W,H,CX,CY,D;
function resize(){const dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+"px";cv.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0);
  CX=W/2;CY=H/2;D=Math.min(W,H)*0.33;}
addEventListener("resize",resize);resize();

const BEACONS=[
  {name:"N",glyph:"◐",gate:"stile", boundary:"observe→act",     tone:262,color:"#4aa3e0",ang:-Math.PI/2,off:0.0,lastD:-1},
  {name:"E",glyph:"◑",gate:"veil",  boundary:"compute→product", tone:392,color:"#9a7cff",ang:0,         off:0.15,lastD:-1},
  {name:"S",glyph:"⟳",gate:"close", boundary:"wrap→closure",    tone:523,color:"#e0b24a",ang:Math.PI/2, off:0.30,lastD:-1},
  {name:"W",glyph:"⊘",gate:"airgap",boundary:"TOPH→Patricia",   tone:330,color:"#5fae7a",ang:Math.PI,   off:0.45,lastD:-1},
];
const ROOT={glyph:"◇",color:"#e0457a"};

// ── live metrics: the real signals the mesh breathes on ──
const M={alive:null,latency:null,version:null,beats:0,lastBeat:-99,beatInterval:4.5,
         gh:null,lastEventId:null,gitHead:null,ghErr:null,started:performance.now()/1000};
let vitality=0, breathT0=-99, rings=[], pulses=[], rootFlash=0, audioOn=false, actx=null;

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function pos(b){return {x:CX+Math.cos(b.ang)*D,y:CY+Math.sin(b.ang)*D};}

async function pollAgent(){
  const t0=performance.now();
  try{
    const ctl=AbortSignal.timeout?AbortSignal.timeout(8000):undefined;
    const r=await fetch("https://0root.ai/health",{cache:"no-store",signal:ctl});
    const j=await r.json();
    const now=performance.now()/1000;
    if(M.lastBeat>0) M.beatInterval=clamp(now-M.lastBeat,2.5,9);
    if(M.version && j.version && j.version!==M.version) onDeploy(j.version);
    M.version=j.version||M.version; M.latency=Math.round(performance.now()-t0);
    M.alive=true; M.lastBeat=now; M.beats++; breathT0=now;
    rootFlash=Math.min(1.5,rootFlash+0.45);                 // a flare on every real heartbeat
    rings.push({x:CX,y:CY,r:18,a:0.5,color:ROOT.color,max:D*1.1,sp:3.2}); // the heartbeat ripple
  }catch(e){ M.alive=false; }
  hud();
}
async function pollGitHub(){
  try{
    const ev=await fetch("https://api.github.com/users/DavidWise01/events/public?per_page=30",{cache:"no-store"})
      .then(r=>{if(!r.ok)throw r.status;return r.json();});
    M.gh=ev.length; M.ghErr=null;
    const push=ev.find(e=>e.type==="PushEvent");
    if(push&&push.payload&&push.payload.head) M.gitHead=push.payload.head.slice(0,7);
    const topId=ev[0]&&ev[0].id;
    if(M.lastEventId&&topId&&topId!==M.lastEventId){
      let n=0; for(const e of ev){ if(e.id===M.lastEventId) break; n++; }
      for(let k=0;k<Math.min(n,6);k++){ fireAnsible(BEACONS[(M.beats+k)%4],true); } // real commits → real pulses
      rootFlash=Math.min(1.8,rootFlash+0.4);
    }
    M.lastEventId=topId;
  }catch(c){ M.ghErr=c; }
  hud();
}

function onDeploy(v){ BEACONS.forEach(b=>fireAnsible(b,true)); rootFlash=2.0; M.deployedAt=performance.now()/1000; }

function beep(tone){ if(!audioOn)return; if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=tone;o.connect(g);g.connect(actx.destination);
  const t=actx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.13,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);o.start(t);o.stop(t+0.55);}
function fireAnsible(b,big){const p=pos(b);pulses.push({x0:p.x,y0:p.y,t:0,color:b.color,sp:big?0.07:0.10});beep(b.tone);
  rings.push({x:p.x,y:p.y,r:14,a:big?0.95:0.6,color:b.color,max:D*0.95,sp:big?2.8:1.7});}

// ── the breath envelope, paced to ONE real heartbeat interval ──
function breathEnv(e){ if(e<0)return 0; if(e>=1)return 0;
  if(e<0.14) return e/0.14;                       // inhale
  if(e<0.86) return Math.pow(1-(e-0.14)/0.72,1.5); // descend 3·2·1
  return 0; }                                     // rest
function densityFromEnv(v){ return v>0.66?3 : v>0.36?2 : v>0.10?1 : 0; }

cv.addEventListener("click",e=>{
  if(Math.hypot(e.clientX-CX,e.clientY-CY)<46){resolveAll();return;}
  for(const b of BEACONS){const p=pos(b);if(Math.hypot(e.clientX-p.x,e.clientY-p.y)<46){fireAnsible(b,true);return;}}
});
function resolveAll(){BEACONS.forEach(b=>fireAnsible(b,true));rootFlash=1.8;}
document.getElementById("resolve").onclick=resolveAll;
document.getElementById("voice").onclick=e=>{audioOn=!audioOn;e.target.classList.toggle("on",audioOn);if(audioOn&&!actx)actx=new(window.AudioContext||window.webkitAudioContext)();};

function hud(){
  const el=document.getElementById("hud");const now=performance.now()/1000;
  const since=M.lastBeat>0?(now-M.lastBeat):null;
  const aliveNow=M.alive&&since!=null&&since<M.beatInterval*2.4;
  const beat=M.alive===null?'<span class="warn">reaching…</span>'
    :aliveNow?'<span class="ok">alive — breathing</span>':'<span class="no">unreachable — holding breath</span>';
  const lat=M.latency!=null?`${M.latency}ms`:"—";
  const dep=M.version?M.version.slice(0,7):"—";
  const head=M.gitHead||"—";
  const sync=(M.gitHead&&M.version)?(M.version.slice(0,7)===M.gitHead?'<span class="ok">in sync ✓</span>':'<span class="warn">deploy pending</span>'):"";
  const gh=M.ghErr?`<span class="warn">rate-limited (${M.ghErr})</span>`:(M.gh!=null?`${M.gh} events`:"—");
  el.innerHTML=
    `<span class="k">0root.ai</span> ${beat} <span class="k">·</span> <b>${lat}</b> <span class="k">· beat #</span><b>${M.beats}</b><br>`+
    `<span class="k">deployed</span> <b>${dep}</b> <span class="k">· git HEAD</span> <b>${head}</b> ${sync}<br>`+
    `<span class="k">github</span> <b>${gh}</b> <span class="k">· breath</span> <b>${M.beatInterval.toFixed(1)}s</b> <span class="k">· vitality</span> <b>${(vitality*100|0)}%</b>`;
}

function frame(){
  const now=performance.now()/1000;
  ctx.clearRect(0,0,W,H);
  // vitality: alive + low-latency → strong; stale/dead → decays to stillness
  const since=now-M.lastBeat;
  const aliveNow=M.alive&&since<M.beatInterval*2.4;
  const tgt=aliveNow?(0.35+0.65*clamp(1-(M.latency||300)/800,0,1)):0;
  vitality+=(tgt-vitality)*0.05;

  ctx.strokeStyle="rgba(120,132,154,.12)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(CX-D*1.2,CY);ctx.lineTo(CX+D*1.2,CY);ctx.moveTo(CX,CY-D*1.2);ctx.lineTo(CX,CY+D*1.2);ctx.stroke();
  for(const b of BEACONS){const p=pos(b);ctx.strokeStyle="rgba(120,132,154,.09)";ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(p.x,p.y);ctx.stroke();}

  ctx.globalCompositeOperation="lighter";
  rings=rings.filter(r=>r.a>0.02&&r.r<r.max);
  for(const r of rings){r.r+=r.sp;r.a*=0.975;ctx.strokeStyle=hexA(r.color,r.a);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke();}

  BEACONS.forEach((b,i)=>{
    const p=pos(b);
    const e=(now-breathT0)/M.beatInterval - b.off*0.35;   // staggered → the wave circulates N→E→S→W
    const lvl=breathEnv(e)*vitality;
    const d=Math.round(densityFromEnv(breathEnv(e))*(vitality>0.15?1:0));
    if(d===1&&b.lastD!==1&&vitality>0.18) fireAnsible(b,false);   // contact → ansible to the root
    b.lastD=d;
    const R=8+lvl*26;
    glow(p.x,p.y,R*2.4,hexA(b.color,0.10+lvl*0.26));
    ctx.fillStyle=hexA(b.color,0.30+lvl*0.6);ctx.beginPath();ctx.arc(p.x,p.y,R,0,7);ctx.fill();
    ctx.globalCompositeOperation="source-over";
    for(let k=0;k<d;k++){const a=now*1.4+(k/Math.max(1,d))*6.283+i;const rr=R+13;
      ctx.fillStyle=hexA(b.color,0.9);ctx.beginPath();ctx.arc(p.x+Math.cos(a)*rr,p.y+Math.sin(a)*rr,2.3,0,7);ctx.fill();}
    ctx.fillStyle=hexA(b.color,0.4+lvl*0.6);ctx.font="20px "+SF;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(b.glyph,p.x,p.y);
    const lx=p.x+Math.cos(b.ang)*(R+34),ly=p.y+Math.sin(b.ang)*(R+34);
    ctx.fillStyle="rgba(180,190,205,.75)";ctx.font="11px "+MF;ctx.fillText(`${b.name} · ${b.gate}`,lx,ly);
    ctx.fillStyle="rgba(120,132,154,.55)";ctx.font="9px "+MF;ctx.fillText(b.boundary,lx,ly+13);
    ctx.globalCompositeOperation="lighter";
  });

  pulses=pulses.filter(p=>p.t<1);
  for(const pu of pulses){pu.t+=pu.sp;const e=ease(pu.t);const x=pu.x0+(CX-pu.x0)*e,y=pu.y0+(CY-pu.y0)*e;
    glow(x,y,15,hexA(pu.color,0.5));ctx.fillStyle=hexA(pu.color,0.95);ctx.beginPath();ctx.arc(x,y,3.4,0,7);ctx.fill();}

  const base=12+Math.sin(now*1.6)*1.6;
  const R=base*(0.5+vitality*0.5)+rootFlash*15; rootFlash*=0.93;
  glow(CX,CY,R*3.2,hexA(ROOT.color,0.12+rootFlash*0.3+vitality*0.05));
  ctx.fillStyle=hexA(ROOT.color,0.45+vitality*0.45);ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.fill();
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle="#fff";ctx.font="18px "+SF;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(ROOT.glyph,CX,CY);
  ctx.fillStyle="rgba(224,69,122,.95)";ctx.font="12px "+MF;ctx.fillText("ROOT0 · 0,0",CX,CY+R+18);
  ctx.fillStyle="rgba(120,132,154,.6)";ctx.font="9px "+MF;ctx.fillText("the GAP · forward⇄inverse",CX,CY+R+33);
  ctx.globalCompositeOperation="lighter";
  requestAnimationFrame(frame);
}
function glow(x,y,r,col){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function ease(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${clamp(a,0,1)})`;}
const SF="Cinzel, Georgia, serif", MF="'Space Mono', monospace";

pollAgent(); setInterval(pollAgent,4500);
pollGitHub(); setInterval(pollGitHub,45000);
hud(); frame();
</script>
</body></html>
